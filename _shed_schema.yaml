            \ input dataset to serve as default for information that cannot be detected\
            \ from the output. One prominent use case is interval data with a non-standard\
            \ column order that cannot be deduced from a header line, but which is\
            \ known to be identical in the input and output datasets."
          title: metadata_source
        name:
          description: Parameter name. Used when referencing parameter in workflows.
          title: name
          type: string
        precreate_directory:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: precreate_directory
        type:
