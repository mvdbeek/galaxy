    get:
      description: Get a list of repositories or perform a search.
      operationId: repositories__index
      parameters:
      - description: This will perform a full search with whoosh on the backend and
          will cause the API endpoint to return a RepositorySearchResult. This should
          not be used with the 'filter' parameter.
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: This will perform a full search with whoosh on the backend
            and will cause the API endpoint to return a RepositorySearchResult. This
            should not be used with the 'filter' parameter.
          title: Search Query
      - description: This will perform a quick search using database operators. This
          should not be used with the 'q' parameter.
        in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: This will perform a quick search using database operators.
            This should not be used with the 'q' parameter.
          title: Filter Text
      - in: query
        name: page
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: ''
          title: Page
      - in: query
        name: page_size
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 10
          title: Page Size
      - in: query
        name: deleted
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Deleted?
      - in: query
        name: owner
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - in: query
        name: name
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - in: query
        name: category_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category ID
      - description: Direction of sort. This defaults to False and causes an ascending
          sort on the field specified by sort_on. This field is ignored if 'q' is
          specified an whoosh search is used.
        in: query
        name: sort_desc
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          description: Direction of sort. This defaults to False and causes an ascending
            sort on the field specified by sort_on. This field is ignored if 'q' is
            specified an whoosh search is used.
          title: Sort Descending
      - description: Sort by the this repository field - direction is controlled by
          sort_desc that defaults to False and causes an ascending sort on this field.
          This field is ignored if 'q' is specified an whoosh search is used.
        in: query
        name: sort_by
        required: false
        schema:
          anyOf:
          - enum:
            - name
            - create_time
            type: string
          - type: 'null'
          default: name
          description: Sort by the this repository field - direction is controlled
            by sort_desc that defaults to False and causes an ascending sort on this
            field. This field is ignored if 'q' is specified an whoosh search is used.
          title: Sort by
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/RepositorySearchResults'
                - items:
                    $ref: '#/components/schemas/Repository'
                  type: array
                - $ref: '#/components/schemas/PaginatedRepositoryIndexResults'
                title: Response Repositories  Index
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Request Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Server Error
      security:
      - APIKeyCookie: []
      - APIKeyQuery: []
      - APIKeyHeader: []
      summary: Index
      tags:
      - repositories
      - repositories
