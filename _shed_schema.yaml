            accomplish.
          title: Description
        id:
          anyOf:
          - type: string
          - type: 'null'
          description: The unique identifier for the class.
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: A short friendly name for the class.
          title: Name
      title: ToolClass
