            - $ref: '#/components/schemas/DataColumnParameterModel'
            - $ref: '#/components/schemas/DirectoryUriParameterModel'
            - $ref: '#/components/schemas/RulesParameterModel'
            - $ref: '#/components/schemas/DrillDownParameterModel'
            - $ref: '#/components/schemas/GroupTagParameterModel'
            - $ref: '#/components/schemas/BaseUrlParameterModel'
            - $ref: '#/components/schemas/GenomeBuildParameterModel'
            - $ref: '#/components/schemas/ColorParameterModel'
            - $ref: '#/components/schemas/ConditionalParameterModel'
            - $ref: '#/components/schemas/RepeatParameterModel'
            - $ref: '#/components/schemas/SectionParameterModel'
          title: inputs
          type: array
        license:
          anyOf:
          - type: string
          - type: 'null'
          title: license
        name:
          title: name
          type: string
        outputs:
          items:
            discriminator:
              mapping:
                boolean: '#/components/schemas/ToolOutputBoolean'
                collection: '#/components/schemas/ToolOutputCollection'
                data: '#/components/schemas/ToolOutputDataset'
                float: '#/components/schemas/ToolOutputFloat'
                integer: '#/components/schemas/ToolOutputInteger'
                text: '#/components/schemas/ToolOutputText'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/ToolOutputDataset'
            - $ref: '#/components/schemas/ToolOutputCollection'
            - $ref: '#/components/schemas/ToolOutputText'
            - $ref: '#/components/schemas/ToolOutputInteger'
            - $ref: '#/components/schemas/ToolOutputFloat'
            - $ref: '#/components/schemas/ToolOutputBoolean'
          title: outputs
          type: array
        profile:
          anyOf:
          - type: string
          - type: 'null'
          title: profile
        repository_revision:
          anyOf:
          - $ref: '#/components/schemas/RepositoryRevisionMetadata'
          - type: 'null'
          title: repository_revision
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: version
        xrefs:
          items:
            $ref: '#/components/schemas/XrefDict'
          title: xrefs
          type: array
      required:
      - id
      - version
      - name
      - description
      - inputs
      - outputs
      - citations
      - license
      - profile
      - edam_operations
      - edam_topics
      - xrefs
      - help
      title: ShedParsedTool
      type: object
    TextParameterModel:
      properties:
        area:
          default: false
          title: area
          type: boolean
        argument:
          anyOf:
          - type: string
          - type: 'null'
          description: If the parameter reflects just one command line argument of
            a certain tool, this tag should be set to that particular argument. It
            is rendered in parenthesis after the help section, and it will create
            the name attribute (if not given explicitly) from the argument attribute
            by stripping leading dashes and replacing all remaining dashes by underscores
            (e.g. if argument="--long-parameter" then name="long_parameter" is implicit).
          title: argument
        default_options:
          default: []
          items:
            $ref: '#/components/schemas/LabelValue'
          title: default_options
          type: array
        help:
          anyOf:
          - type: string
          - type: 'null'
          description: Short bit of text, rendered on the tool form just below the
            associated field to provide information about the field.
          title: help
        hidden:
          default: false
          title: hidden
          type: boolean
        is_dynamic:
          default: false
          title: is_dynamic
          type: boolean
        label:
          anyOf:
          - type: string
          - type: 'null'
          description: Will be displayed on the tool page as the label of the parameter.
          title: label
        name:
          description: Parameter name. Used when referencing parameter in workflows
            or inside command templating.
          title: name
          type: string
        optional:
          default: false
          description: If `false`, parameter must have a value.
          title: optional
          type: boolean
        parameter_type:
          const: gx_text
          default: gx_text
          title: parameter_type
          type: string
        type:
          const: text
          title: type
          type: string
        validators:
          default: []
          items:
            anyOf:
            - $ref: '#/components/schemas/LengthParameterValidatorModel'
            - $ref: '#/components/schemas/RegexParameterValidatorModel'
            - $ref: '#/components/schemas/ExpressionParameterValidatorModel'
            - $ref: '#/components/schemas/EmptyFieldParameterValidatorModel'
          title: validators
          type: array
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: default_value
      required:
      - name
      - type
      title: TextParameterModel
      type: object
    Tool:
      properties:
        aliases:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: "Support for this parameter is optional for tool registries\
            \ that support aliases.\nA list of strings that can be used to identify\
            \ this tool which could be  straight up URLs. \nThis can be used to expose\
            \ alternative ids (such as GUIDs) for a tool\nfor registries. Can be used\
            \ to match tools across registries."
          title: Aliases
        checker_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional url to the checker tool that will exit successfully
            if this tool produced the expected result given test data.
          title: Checker Url
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: The description of the tool.
          title: Description
        has_checker:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether this tool has a checker tool associated with it.
          title: Has Checker
        id:
          description: A unique identifier of the tool, scoped to this registry.
          examples:
          - 123456
          title: Id
          type: string
        meta_version:
          anyOf:
          - type: string
          - type: 'null'
          description: The version of this tool in the registry. Iterates when fields
            like the description, author, etc. are updated.
          title: Meta Version
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: The name of the tool.
          title: Name
        organization:
          description: The organization that published the image.
          title: Organization
          type: string
        toolclass:
          $ref: '#/components/schemas/ToolClass'
        url:
          description: The URL for this tool in this registry.
          examples:
          - http://agora.broadinstitute.org/tools/123456
          title: Url
          type: string
        versions:
          description: A list of versions for this tool.
          items:
            $ref: '#/components/schemas/ToolVersion'
          title: Versions
          type: array
      required:
