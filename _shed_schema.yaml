    APIKeyHeader:
      in: header
      name: x-api-key
      type: apiKey
    APIKeyQuery:
      in: query
      name: key
      type: apiKey
info:
  description: This API allows you to manage the Tool Shed repositories.
  license:
    name: MIT
    url: https://github.com/galaxyproject/galaxy/blob/dev/LICENSE.txt
  title: Galaxy Tool Shed API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/authenticate/baseauth:
    get:
      operationId: authenticate__baseauth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResponse'
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Request Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Server Error
      summary: Returns returns an API key for authenticated user based on BaseAuth
        headers.
      tags:
      - authenticate
      - authenticate
  /api/categories:
    get:
      description: index category
      operationId: categories__index
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Category'
                title: Response Categories  Index
                type: array
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Request Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Server Error
      security:
      - APIKeyCookie: []
      - APIKeyQuery: []
      - APIKeyHeader: []
      summary: Index
      tags:
      - categories
      - categories
    post:
      description: create a category
      operationId: categories__create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: Successful Response
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Request Error
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExceptionModel'
          description: Server Error
      security:
      - APIKeyCookie: []
      - APIKeyQuery: []
      - APIKeyHeader: []
      summary: Create
      tags:
      - categories
      - categories
