name: API tests
on:
  push:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/api.yaml'
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - '!doc/**'
      - '!packages/test_selenium/**'
      - '!.github/workflows/**'
      - '.github/workflows/api.yaml'
  schedule:
    # Run at midnight UTC every Tuesday
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      use_cached_toolbox:
        description: "Run with use_cached_toolbox=true (CachedToolBox)"
        type: boolean
        default: true
env:
  GALAXY_DEPENDENCIES_INSTALL_WEASYPRINT: '1'
  GALAXY_TEST_DBURI: 'postgresql+psycopg://postgres:postgres@localhost:5432/galaxy?client_encoding=utf8'
  GALAXY_TEST_RAISE_EXCEPTION_ON_HISTORYLESS_HDA: '1'
  GALAXY_CONFIG_SQLALCHEMY_WARN_20: '1'
  GALAXY_TEST_REQUIRE_ALL_NEEDED_TOOLS: '1'
permissions: {}
jobs:
  test:
    if: >-
      github.event_name != 'push'
      || github.repository_owner != 'galaxyproject'
      || github.ref_name == 'dev'
      || startsWith(github.ref_name, 'release_')
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        attempt: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - if: github.event_name == 'schedule'
        run: |
          echo "GALAXY_CONFIG_OVERRIDE_METADATA_STRATEGY=extended" >> $GITHUB_ENV
          echo "GALAXY_CONFIG_OVERRIDE_OUTPUTS_TO_WORKING_DIRECTORY=true" >> $GITHUB_ENV
      - if: github.event_name == 'workflow_dispatch' && inputs.use_cached_toolbox
        run: |
          echo "GALAXY_CONFIG_OVERRIDE_USE_CACHED_TOOLBOX=true" >> $GITHUB_ENV
      - uses: actions/checkout@v7.0.1
        with:
          path: 'galaxy root'
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Start resource sampling
        run: |
          mkdir -p "$RUNNER_TEMP/pdiag"
          nproc; free -m
          nohup vmstat -t -S M 5 > "$RUNNER_TEMP/pdiag/vmstat.log" 2>&1 &
      - name: Run tests
        run: ./run_tests.sh --skip_flakey_fails -api lib/galaxy_test/api -- -n 4
        env:
          GALAXY_PEBBLE_DIAG_DIR: ${{ runner.temp }}/pdiag
          # Coverage slows the tests down; collect it for pushes and scheduled runs only.
          GALAXY_TEST_COVERAGE: ${{ github.event_name != 'pull_request' && '1' || '' }}
        working-directory: 'galaxy root'
      - name: Resource summary
        if: always()
        run: |
          awk 'NR>2 {n++; us+=$13; sy+=$14; id+=$15; wa+=$16; r+=$1; if (n==1 || $4<minfree) minfree=$4} END {printf "samples=%d avg runq=%.1f us=%.0f sy=%.0f id=%.0f wa=%.0f min_free_mb=%d\n", n, r/n, us/n, sy/n, id/n, wa/n, minfree}' "$RUNNER_TEMP/pdiag/vmstat.log"
          awk 'NR>2 && $15 < 5 {busy++} NR>2 {n++} END {printf "samples with idle<5%%: %d/%d\n", busy, n}' "$RUNNER_TEMP/pdiag/vmstat.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-api-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/pdiag
            galaxy root/run_*tests.html

